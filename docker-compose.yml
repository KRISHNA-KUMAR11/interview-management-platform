services:
  mongo:
    image: mongo:7
    container_name: imp-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - imp_mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }) }",
        ]
      interval: 5s
      timeout: 10s
      start_period: 15s
      retries: 12

  coturn:
    image: coturn/coturn:4.6.2
    container_name: imp-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    command:
      [
        "-n",
        "--log-file=stdout",
        "--lt-cred-mech",
        "--fingerprint",
        "--realm=interview.local",
        "--user=interview:interview-turn",
        "--listening-port=3478",
        "--min-port=49160",
        "--max-port=49200",
        "--external-ip=${TURN_PUBLIC_IP:-127.0.0.1}",
      ]

  s3:
    image: adobe/s3mock:latest
    container_name: imp-s3
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      initialBuckets: interview-recordings
    volumes:
      - imp_s3_data:/tmp/s3mock

  mailpit:
    image: axllent/mailpit:latest
    container_name: imp-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  imp_mongo_data:
  imp_s3_data:
